<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Quiz</title>
        <script src="script.js" defer></script>
    </head>

    <body>

        <h1>Quiz Game</h1>

        <div id="mainPanel">

            <h2>Theme: </h2>

            <div id="questionScreen">
                <p id="question">Question 1: 2 x 4 = ?</p>
                <p id="result">-</p>
            </div>

            <button id="optionOne" class="answerBtn">Option 1: 2</button>
            <button id="optionTwo" class="answerBtn">Option 2: 4</button>
            <button id="optionThree" class="answerBtn">Option 3: 8</button>
            <button id="optionFour" class="answerBtn">Option 4: 6</button>

        </div>

    </body>

</html>
