<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Quiz</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <h1>Quiz Game</h1>

        <div id="mainPanel">


            <h2 id="theme">Theme: </h2>

            <div id="questionScreen">
                <p id="question">Question</p>
                <p id="result">-</p>
            </div>

            <div class="choices">
            <button id="optionOne" class="answerBtn">Option 1:</button>
            <button id="optionTwo" class="answerBtn">Option 2:</button>
            <button id="optionThree" class="answerBtn">Option 3:</button>
            <button id="optionFour" class="answerBtn">Option 4:</button>
            </div>

            <button id="start">START</button>
        </div>

    </body>

</html>
