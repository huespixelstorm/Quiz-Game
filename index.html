<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Quiz</title>
        <script src="questions.js" defer></script>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <h1>Quiz Game</h1>

        <div id="mainPanel">

            <div class="info">
            <h2 id="theme">Theme: </h2>
            <h2 id="score">Score: </h2>
            <h2 id="gamemode">Gamemode: Endless</h2>
            </div>

            <div id="questionScreen">
                <p id="questionNo"></p>
                <p id="question">Question</p>
                <p id="result">-</p>
            </div>

            <div class="choices">
            <button id="optionOne" class="answerBtn">-</button>
            <button id="optionTwo" class="answerBtn">-</button>
            <button id="optionThree" class="answerBtn">-</button>
            <button id="optionFour" class="answerBtn">-</button>
            </div>

            <button id="start">START</button>
        </div>

    </body>

</html>
